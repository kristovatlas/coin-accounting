[project]
name = "coinacct"
version = "0.0.0"
description = "Local, privacy-first Bitcoin cost basis and doxx tracking (see PLAN.md)"
requires-python = "==3.13.*"
# Dependencies are added only after human approval (ENGINEERING §2.4, docs/DEPENDENCIES.md).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "hypothesis==6.168.2",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
# ENGINEERING §2.2. The "(verify at setup)" items are confirmed in M0.2 with the pinned uv.
package = false                 # virtual project: never build or run a build backend for our own code
no-build = true                 # wheels only, no sdist builds, no exceptions
exclude-newer = "7 days"        # 7-day cooldown, recorded in uv.lock
python-downloads = "never"      # the interpreter comes from `make toolchain` only
python-preference = "only-system"
index-strategy = "first-index"
cache-dir = ".uv-cache"         # project-local cache (ENGINEERING §2.7)

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["backend", "e2e", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "TID", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = ["S101", "S603", "PLC0415"]
"backend/tests/**" = ["S101", "S104", "S105", "S106", "S108"]  # asserts; test addresses, credentials and paths
"e2e/harness/**" = ["S101"]

[tool.pytest.ini_options]
# pytest's built-in pastebin plugin uploads test output to bpa.st when run with --pastebin.
# It is built in, so PYTEST_DISABLE_PLUGIN_AUTOLOAD doesn't stop it; disable it explicitly
# so no unlisted dev-time network flow exists (THREAT_MODEL §6, PR #65 review).
addopts = "-p no:pastebin -p no:cacheprovider --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend", "e2e"]

[tool.coverage.run]
branch = true
source = ["backend/coinacct"]
data_file = ".coverage"

[tool.coverage.report]
# coverage.py rounds the total to `precision` digits before comparing it with --fail-under; with
# the default of 0, 94.6 % would pass the 95 % floor; at 2, only 94.995 % and up do (ENGINEERING §3.3).
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend:e2e"
explicit_package_bases = true
